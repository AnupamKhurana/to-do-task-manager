<!DOCTYPE html>
<html>
<head>
    <title>{{ list.title }} - ChronoTask Nexus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="list-box">
        <h1>{{ list.title }}</h1>
        <a href="/">Back to all lists</a>
        <h2>Add New Task</h2>
        <form action="/add_task" method="post" class="add-task-form">
            <input type="hidden" name="list_id" value="{{ list.id }}">
            <input type="text" name="title" placeholder="Task title" required>
            <button type="submit">Add Task</button>
        </form>
        <table>
            <tr>
                <th>Completed</th>
                <th>Title</th>
                <th>Actions</th>
            </tr>
            {% for task in list.tasks %}
            <tr>
                <td>
                    <form action="/toggle_task/{{ task.id }}" method="post">
                        <button type="submit">{{ '✓' if task.completed else '✗' }}</button>
                    </form>
                </td>
                <td class="{{ 'completed' if task.completed else '' }}">{{ task.title }}</td>
                <td>
                    <form action="/delete_task/{{ task.id }}" method="post">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        <form action="/delete_list/{{ list.id }}" method="post">
            <button type="submit" class="delete-btn">Delete List</button>
        </form>
    </div>
</div>
</body>
</html>
