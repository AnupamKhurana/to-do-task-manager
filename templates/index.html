<!DOCTYPE html>
<html>
<head>
    <title>ChronoTask Nexus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>ChronoTask Nexus</h1>

    <h2>Add New List</h2>
    <form action="/add_list" method="post" class="add-list-form">
        <input type="text" name="title" placeholder="List title" required>
        <button type="submit">Add List</button>
    </form>

    {% for list in lists %}
    <div class="list-box">
        <h3><a href="/list/{{ list.id }}">{{ list.title }}</a></h3>
        <form action="/add_task" method="post" class="add-task-form">
            <input type="hidden" name="list_id" value="{{ list.id }}">
            <input type="text" name="title" placeholder="Task title" required>
            <button type="submit">Add Task</button>
        </form>
        <table>
            <tr>
                <th>Completed</th>
                <th>Title</th>
                <th>Actions</th>
            </tr>
            {% for task in list.tasks %}
            <tr>
                <td>
                    <form action="/toggle_task/{{ task.id }}" method="post">
                        <button type="submit">{{ '✓' if task.completed else '✗' }}</button>
                    </form>
                </td>
                <td class="{{ 'completed' if task.completed else '' }}">{{ task.title }}</td>
                <td>
                    <form action="/delete_task/{{ task.id }}" method="post">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        <form action="/delete_list/{{ list.id }}" method="post">
            <button type="submit" class="delete-btn">Delete List</button>
        </form>
    </div>
    {% endfor %}
</div>
    <script>
        // Log computed styles for titles
        document.addEventListener('DOMContentLoaded', () => {
            const titles = document.querySelectorAll('h1, h2, h3');
            titles.forEach(t => {
                const style = window.getComputedStyle(t);
                console.log(`Title ${t.tagName} - font-size: ${style.fontSize}, color: ${style.color}, margin: ${style.marginTop}`);
            });
        });
    </script>
</body>
</html>
